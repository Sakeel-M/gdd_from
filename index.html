<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Social Eagle — Registration</title>
  <style>
    :root {
      --red: #c8102e;
      --red-dark: #9c0d24;
      --ink: #1f2426;
      --muted: #6b7280;
      --line: #e5e7eb;
      --bg: #f4f5f7;
      --card: #ffffff;
      --ok: #15803d;
      --err: #b91c1c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .card {
      width: 100%;
      max-width: 460px;
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08);
      overflow: hidden;
    }
    .head {
      background: #ffffff;
      padding: 30px 24px 24px;
      text-align: center;
      border-bottom: 1px solid var(--line);
    }
    .head img { max-width: 240px; width: 80%; height: auto; }
    .accent { height: 4px; background: var(--red); }
    .body { padding: 28px 24px 8px; }
    h1 {
      font-size: 20px;
      margin: 0 0 4px;
      text-align: center;
    }
    .sub {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      margin: 0 0 24px;
    }
    .field { margin-bottom: 18px; }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    label .req { color: var(--red); }
    input {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      border: 1.5px solid var(--line);
      border-radius: 10px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
      background: #fff;
      color: var(--ink);
    }
    input:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(200,16,46,0.12);
    }
    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      background: var(--red);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 6px;
      transition: background .15s, opacity .15s;
    }
    button:hover:not(:disabled) { background: var(--red-dark); }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .msg {
      text-align: center;
      font-size: 14px;
      margin: 16px 0 0;
      min-height: 20px;
      font-weight: 600;
    }
    .msg.ok { color: var(--ok); }
    .msg.err { color: var(--err); }
    .foot {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      padding: 16px 24px 22px;
    }
    .foot span { color: var(--red); font-weight: 700; }

    /* Success popup */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 18, 20, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 50;
      opacity: 0;
      transition: opacity .2s ease;
    }
    .overlay.show { display: flex; opacity: 1; }
    .modal {
      background: #fff;
      border-radius: 18px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      padding: 34px 28px 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      transform: translateY(12px) scale(.98);
      transition: transform .2s ease;
    }
    .overlay.show .modal { transform: translateY(0) scale(1); }
    .tick {
      width: 68px; height: 68px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: var(--red);
      display: flex; align-items: center; justify-content: center;
    }
    .tick svg { width: 34px; height: 34px; }
    .modal h2 { margin: 0 0 10px; font-size: 22px; color: var(--ink); }
    .modal p { margin: 0 0 22px; font-size: 15px; line-height: 1.55; color: var(--muted); }
    .modal p strong { color: var(--red); }
    .modal button {
      margin-top: 0;
      width: auto;
      padding: 11px 30px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="head">
      <img src="logo_light.png" alt="Social Eagle" />
    </div>
    <div class="accent"></div>
    <div class="body">
      <p class="sub">Fill in the details to get the PDF.</p>

      <form id="regForm" autocomplete="on">
        <div class="field">
          <label for="name">Name <span class="req">*</span></label>
          <input type="text" id="name" name="name" placeholder="Your full name" required />
        </div>
        <div class="field">
          <label for="email">Email <span class="req">*</span></label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required />
        </div>
        <div class="field">
          <label for="phone">Phone Number <span class="req">*</span></label>
          <input type="tel" id="phone" name="phone" placeholder="+91 98765 43210"
                 pattern="[0-9+\-\s()]{7,20}" required />
        </div>
        <div class="field">
          <label for="location">Location <span class="req">*</span></label>
          <input type="text" id="location" name="location" placeholder="City, State" required />
        </div>
        <button type="submit" id="submitBtn">Submit</button>
        <p class="msg" id="msg"></p>
      </form>
    </div>
    <div class="foot">together we rise &nbsp;·&nbsp; <span>Social Eagle</span></div>
  </div>

  <!-- Success popup -->
  <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="okTitle">
    <div class="modal">
      <div class="tick">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 6L9 17l-5-5" stroke="#fff" stroke-width="3"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h2 id="okTitle">Thank You!</h2>
      <p>The PDF has been sent via mail.<br><strong>Kindly check your email.</strong></p>
      <button type="button" id="closeModal">Done</button>
    </div>
  </div>

  <script>
    // ⬇️ PASTE your Google Apps Script Web App URL here (see SETUP.md)
    const SCRIPT_URL = "https://script.google.com/a/macros/socialeagle.ai/s/AKfycbxOpjkUmWTwC51ig0aeDBsTHDBjqYTlWMB1CGgwf9rTRbcv0ec1CIYyJMrHf0UKdjok/exec";

    const form = document.getElementById("regForm");
    const btn = document.getElementById("submitBtn");
    const msg = document.getElementById("msg");
    const overlay = document.getElementById("overlay");

    document.getElementById("closeModal").addEventListener("click", () => {
      overlay.classList.remove("show");
    });
    overlay.addEventListener("click", (e) => {
      if (e.target === overlay) overlay.classList.remove("show");
    });

    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      msg.className = "msg";
      msg.textContent = "";

      if (!SCRIPT_URL || SCRIPT_URL.includes("PASTE_YOUR_WEB_APP_URL")) {
        msg.className = "msg err";
        msg.textContent = "Setup needed: add your Web App URL in index.html.";
        return;
      }

      const data = new URLSearchParams();
      data.append("name", document.getElementById("name").value.trim());
      data.append("email", document.getElementById("email").value.trim());
      data.append("phone", document.getElementById("phone").value.trim());
      data.append("location", document.getElementById("location").value.trim());

      btn.disabled = true;
      btn.textContent = "Submitting…";

      try {
        // Apps Script web apps don't send CORS headers, so we use no-cors.
        // The write still succeeds; we just can't read the response body.
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: data.toString(),
        });

        form.reset();
        overlay.classList.add("show");
      } catch (err) {
        msg.className = "msg err";
        msg.textContent = "Something went wrong. Please try again.";
      } finally {
        btn.disabled = false;
        btn.textContent = "Submit";
      }
      
    });
  </script>
</body>
</html>
